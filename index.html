<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi familia">
<meta name="theme-color" content="#7c3aed">
<title>Aprender Español — Mi familia</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at 20% 10%, #f3e8ff 0%, #faf5ff 45%, #fdf2f8 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: auto;
  }
  .wrap { width: 100%; max-width: 420px; }

  .eyebrow {
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    color: #a78bfa;
    font-weight: 700;
    text-transform: uppercase;
  }
  .page-title {
    text-align: center;
    font-size: 24px;
    font-weight: 800;
    color: #4c1d95;
    margin: 2px 0 22px;
  }

  .topic-title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .print-icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid #e9d5ff;
    background: white;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    box-shadow: 0 2px 8px rgba(124,58,237,0.10);
  }
  .print-icon-btn:hover { background: #faf5ff; }

  .back-btn {
    border: none;
    background: none;
    color: #a78bfa;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
    padding: 4px 0;
    display: inline-block;
  }

  .topic-card, .link-card {
    width: 100%;
    text-align: left;
    background: #ffffff;
    border: 2px solid #e9d5ff;
    border-radius: 20px;
    padding: 20px 22px;
    margin-bottom: 12px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(124,58,237,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .link-card { background: #faf5ff; border-color: #d8b4fe; margin-bottom: 14px; }
  .topic-card .label-small { font-size: 11px; color: #a78bfa; font-weight: 700; text-transform: uppercase; }
  .topic-card .label-big, .link-card .label-big { font-size: 19px; font-weight: 800; color: #4c1d95; }
  .link-card .label-big { color: #6d28d9; font-size: 20px; }
  .topic-card .label-sub, .link-card .label-sub { font-size: 13px; color: #9ca3af; margin-top: 2px; }
  .arrow { font-size: 22px; color: #c4b5fd; }

  .soon-card {
    width: 100%;
    background: #fafafa;
    border: 2px dashed #e5e7eb;
    border-radius: 20px;
    padding: 14px 22px;
    margin-bottom: 10px;
    color: #b0b0b0;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .soon-card .label-big { font-size: 14px; font-weight: 700; color: #b0b0b0; line-height: 1.3; }
  .soon-card .label-sub { font-size: 12px; color: #cbcbcb; margin-top: 1px; }

  .block-header {
    font-size: 12px;
    font-weight: 800;
    color: #a78bfa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 20px 0 8px;
    padding-left: 2px;
  }
  .block-header:first-of-type { margin-top: 10px; }

  .soon-badge {
    font-size: 10px;
    font-weight: 700;
    color: #c4b5fd;
    background: #f3e8ff;
    padding: 3px 9px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
    margin-left: 10px;
  }

  /* card (flashcard / wizard) */
  .flash-card {
    background: #fff;
    border-radius: 24px;
    border: 2px solid #e9d5ff;
    box-shadow: 0 10px 30px rgba(124,58,237,0.10);
    padding: 30px 24px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    text-align: center;
  }
  .flash-word { font-size: 28px; font-weight: 800; color: #5b21b6; }
  .flash-tag {
    font-size: 10px; color: white; background: #c4b5fd;
    padding: 2px 8px; border-radius: 10px; font-weight: 700;
  }
  .flash-tr {
    font-size: 17px; color: #be185d; font-weight: 700;
    background: #fdf2f8; padding: 6px 18px; border-radius: 999px;
  }
  .flash-hint { font-size: 12px; color: #c4b5fd; }

  .progress-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; }
  .progress-dots div { width: 20px; height: 6px; border-radius: 4px; background: #ede9fe; }

  .answer-btns { display: flex; gap: 12px; margin-top: 20px; }
  .answer-btns button {
    flex: 1; padding: 13px 0; border-radius: 16px; border: none;
    font-size: 14px; font-weight: 700; cursor: not-allowed;
    background: #f5f5f5; color: #c4c4c4;
  }
  .answer-btns button.active { cursor: pointer; }
  .answer-btns button.no.active { background: #fee2e2; color: #b91c1c; }
  .answer-btns button.yes.active { background: #dcfce7; color: #15803d; }

  .counter { text-align: center; margin-top: 12px; font-size: 12px; color: #c4b5fd; }

  .conj-grid {
    width: 100%; background: #faf5ff; border-radius: 14px; padding: 12px 14px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 5px 12px; font-size: 13px;
  }
  .conj-grid span.pron { color: #9ca3af; }
  .conj-grid b { color: #2d2d2d; }

  .stage-label {
    font-size: 10px; color: #a78bfa; font-weight: 700;
    text-transform: uppercase; margin-bottom: 3px;
  }
  .stage-line { font-size: 13px; color: #374151; }

  .stage-dots { display: flex; gap: 6px; justify-content: center; margin-top: 14px; }
  .stage-dots div { width: 8px; height: 8px; border-radius: 50%; background: #ede9fe; }
  .stage-dots div.filled { background: #7c3aed; }

  .result-box {
    background: #fff; border-radius: 24px; border: 2px solid #e9d5ff;
    padding: 32px 22px; text-align: center;
  }
  .result-emoji { font-size: 40px; margin-bottom: 8px; }
  .result-title { font-size: 18px; font-weight: 800; color: #4c1d95; margin-bottom: 6px; }
  .result-sub { font-size: 14px; color: #8b7bb8; margin-bottom: 20px; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .chip { background: #fdf2f8; color: #be185d; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; }

  .result-btns { display: flex; gap: 10px; }
  .result-btns button {
    flex: 1; padding: 12px 0; border-radius: 16px; font-size: 13px; font-weight: 700; cursor: pointer; border: none;
  }
  .btn-primary { background: #7c3aed; color: white; }
  .btn-secondary { background: white; color: #7c3aed; border: 2px solid #e9d5ff !important; }

  /* quiz */
  .quiz-sentence {
    font-size: 19px;
    font-weight: 700;
    color: #4c1d95;
    text-align: center;
    line-height: 1.4;
  }
  .quiz-sentence .blank {
    display: inline-block;
    min-width: 60px;
    border-bottom: 3px solid #d8b4fe;
    color: #a855f7;
  }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 18px; }
  .option-btn {
    padding: 13px 16px;
    border-radius: 14px;
    border: 2px solid #e9d5ff;
    background: white;
    font-size: 15px;
    font-weight: 700;
    color: #4c1d95;
    cursor: pointer;
    text-align: center;
  }
  .option-btn.correct { background: #dcfce7; border-color: #4ade80; color: #15803d; }
  .option-btn.wrong { background: #fee2e2; border-color: #f87171; color: #b91c1c; }
  .option-btn.disabled { cursor: default; }
  .next-btn {
    margin-top: 18px;
    width: 100%;
    padding: 13px 0;
    border-radius: 16px;
    border: none;
    background: #7c3aed;
    color: white;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  /* dialogue flashcards */
  .dchunk-line { margin-bottom: 12px; text-align: left; width: 100%; }
  .dchunk-line:last-child { margin-bottom: 0; }
  .dialog-speaker { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
  .dialog-speaker.ana { color: #6d28d9; }
  .dialog-speaker.pablo { color: #be185d; }
  .dchunk-es { font-size: 16px; font-weight: 700; color: #2d2d2d; margin-top: 2px; }
  .dchunk-ru {
    font-size: 13px; color: #be185d; font-weight: 600;
    margin-top: 3px; background: #fdf2f8; display: inline-block;
    padding: 3px 10px; border-radius: 10px;
  }

  /* ═══ МАТЕРИАЛЫ (справочник по теме, для чтения на экране) ═══ */
  .mat-nav {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 20px;
  }
  .mat-nav button {
    padding: 6px 12px;
    border-radius: 999px;
    border: 2px solid #e9d5ff;
    background: white;
    color: #7c3aed;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .mat-nav button:hover { background: #faf5ff; }

  .mat-section { margin-bottom: 20px; scroll-margin-top: 16px; }
  .mat-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .mat-header .icon { font-size: 18px; }
  .mat-header .title { font-size: 16px; font-weight: 800; color: #4c1d95; }

  .mat-card {
    background: #fff;
    border: 2px solid #e9d5ff;
    border-radius: 18px;
    padding: 4px 14px;
    box-shadow: 0 6px 20px rgba(124,58,237,0.06);
  }

  .mat-subhead {
    font-size: 11px; color: #a78bfa; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 10px 0 2px;
  }
  .mat-subhead:first-child { margin-top: 8px; }

  /* строка "слово — перевод" */
  .mat-row-inline {
    display: flex; align-items: baseline; gap: 8px;
    padding: 8px 2px; border-bottom: 1px dashed #e9d5ff;
  }
  .mat-row-inline:last-child { border-bottom: none; }
  .mat-row-inline .es { font-size: 14px; font-weight: 700; color: #6d28d9; white-space: nowrap; }
  .mat-row-inline .ru { font-size: 13px; color: #6b7280; }
  .mat-row-inline .ru::before { content: "— "; color: #d8b4fe; }

  /* глагол: инфинитив+перевод сверху, спряжение снизу */
  .mat-row-stacked { padding: 9px 2px; border-bottom: 1px dashed #e9d5ff; }
  .mat-row-stacked:last-child { border-bottom: none; }
  .mat-row-stacked .main { font-size: 14px; color: #2d2d2d; }
  .mat-row-stacked .main b { color: #6d28d9; }
  .mat-row-stacked .sub { font-size: 12px; color: #9ca3af; margin-top: 2px; }

  /* реплика/пример: текст + перевод в одном абзаце */
  .mat-row-pair { padding: 9px 2px; border-bottom: 1px dashed #e9d5ff; font-size: 13.5px; line-height: 1.5; color: #2d2d2d; }
  .mat-row-pair:last-child { border-bottom: none; }
  .mat-row-pair .ru { color: #be185d; font-style: italic; }
  .mat-row-pair .speaker { font-weight: 700; }
  .mat-row-pair .speaker.ana { color: #6d28d9; }
  .mat-row-pair .speaker.pablo { color: #be185d; }

  /* прилагательное: слово — перевод ≠ антоним — перевод */
  .mat-row-adj { padding: 9px 2px; border-bottom: 1px dashed #e9d5ff; font-size: 13.5px; line-height: 1.5; }
  .mat-row-adj:last-child { border-bottom: none; }
  .mat-row-adj b { color: #6d28d9; }
  .mat-row-adj .tr { color: #6b7280; }
  .mat-row-adj .ant-tr { color: #9ca3af; font-style: italic; }

  .mat-note {
    margin: 10px 0 8px;
    background: #ecfdf5;
    border: 1px solid #6ee7b7;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    color: #065f46;
    line-height: 1.4;
  }
  .mat-note b { color: #047857; }
</style>
</head>

<body>

<div class="wrap" id="app"></div>

<script>
/* ═══════════════ ДАННЫЕ ═══════════════ */

const WORDS = [
  { es: "la madre", ru: "мама" },
  { es: "el padre", ru: "папа" },
  { es: "la hermana", ru: "сестра" },
  { es: "el hermano", ru: "брат" },
  { es: "la abuela", ru: "бабушка" },
  { es: "el abuelo", ru: "дедушка" },
  { es: "el hijo", ru: "сын" },
  { es: "la hija", ru: "дочь" },
  { es: "la tía", ru: "тётя" },
  { es: "el tío", ru: "дядя" },
  { es: "el primo", ru: "двоюродный брат" },
  { es: "la prima", ru: "двоюродная сестра" },
];

const VERBS = [
  { inf: "ser", tr: "быть", tag: "неправильный",
    conj: [["yo","soy"],["tú","eres"],["él/ella","es"],["nosotros","somos"],["vosotros","sois"],["ellos","son"]],
    phrases: ["soy la hija", "es mi tía"],
    sentences: ["Yo soy la hija de mi madre.", "Mi hermano es el hijo de mi padre."] },
  { inf: "estar", tr: "быть (состояние)", tag: "неправ. (yo)",
    conj: [["yo","estoy"],["tú","estás"],["él/ella","está"],["nosotros","estamos"],["vosotros","estáis"],["ellos","están"]],
    phrases: ["estoy con mi abuela", "está feliz"],
    sentences: ["Mi abuela está en casa hoy.", "Yo estoy con mi hermana."] },
  { inf: "tener", tr: "иметь", tag: "e → ie",
    conj: [["yo","tengo"],["tú","tienes"],["él/ella","tiene"],["nosotros","tenemos"],["vosotros","tenéis"],["ellos","tienen"]],
    phrases: ["tengo un hermano", "tiene dos primas"],
    sentences: ["Tengo una hermana y un hermano.", "Mi tía tiene tres hijos."] },
  { inf: "vivir", tr: "жить", tag: "регулярный",
    conj: [["yo","vivo"],["tú","vives"],["él/ella","vive"],["nosotros","vivimos"],["vosotros","vivís"],["ellos","viven"]],
    phrases: ["vivo con mi madre", "vive con sus abuelos"],
    sentences: ["Vivo con mi padre y mi madre.", "Mi primo vive con su abuela."] },
  { inf: "llamarse", tr: "зваться", tag: "возвратный",
    conj: [["yo","me llamo"],["tú","te llamas"],["él/ella","se llama"],["nosotros","nos llamamos"],["vosotros","os llamáis"],["ellos","se llaman"]],
    phrases: ["mi hermano se llama…", "mi tía se llama…"],
    sentences: ["Mi hermano se llama Pablo.", "Mi abuela se llama Rosa."] },
  { inf: "querer", tr: "любить / хотеть", tag: "e → ie",
    conj: [["yo","quiero"],["tú","quieres"],["él/ella","quiere"],["nosotros","queremos"],["vosotros","queréis"],["ellos","quieren"]],
    phrases: ["quiero a mi abuela", "quiere a su hermana"],
    sentences: ["Quiero mucho a mi madre.", "Mi padre quiere a toda la familia."] },
  { inf: "abrazar", tr: "обнимать", tag: "регулярный",
    conj: [["yo","abrazo"],["tú","abrazas"],["él/ella","abraza"],["nosotros","abrazamos"],["vosotros","abrazáis"],["ellos","abrazan"]],
    phrases: ["abrazo a mi padre", "abraza a su hermano"],
    sentences: ["Abrazo a mi abuela cada día.", "Mi hermana abraza a mi madre."] },
  { inf: "cuidar", tr: "заботиться", tag: "регулярный",
    conj: [["yo","cuido"],["tú","cuidas"],["él/ella","cuida"],["nosotros","cuidamos"],["vosotros","cuidáis"],["ellos","cuidan"]],
    phrases: ["cuido a mi hermana", "cuida a sus abuelos"],
    sentences: ["Cuido a mi hermana pequeña.", "Mi tía cuida a los abuelos."] },
  { inf: "ayudar", tr: "помогать", tag: "регулярный",
    conj: [["yo","ayudo"],["tú","ayudas"],["él/ella","ayuda"],["nosotros","ayudamos"],["vosotros","ayudáis"],["ellos","ayudan"]],
    phrases: ["ayudo a mi madre", "ayuda a su padre"],
    sentences: ["Ayudo a mi madre en casa.", "Mi hermano ayuda a mi padre."] },
  { inf: "parecerse (a)", tr: "быть похожим", tag: "c → zc (yo)",
    conj: [["yo","me parezco"],["tú","te pareces"],["él/ella","se parece"],["nosotros","nos parecemos"],["vosotros","os parecéis"],["ellos","se parecen"]],
    phrases: ["me parezco a mi padre", "se parece a su abuela"],
    sentences: ["Me parezco mucho a mi madre.", "Mi prima se parece a su padre."] },
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const QUESTIONS = [
  { sentence: "La madre de mi madre es mi ___.", options: ["abuela", "tía", "prima"], answer: "abuela" },
  { sentence: "El padre de mi padre es mi ___.", options: ["abuelo", "tío", "primo"], answer: "abuelo" },
  { sentence: "El hijo de mi tía es mi ___.", options: ["primo", "hermano", "tío"], answer: "primo" },
  { sentence: "La hija de mi tío es mi ___.", options: ["prima", "hermana", "tía"], answer: "prima" },
  { sentence: "El hermano de mi madre es mi ___.", options: ["tío", "primo", "abuelo"], answer: "tío" },
  { sentence: "La hermana de mi padre es mi ___.", options: ["tía", "prima", "abuela"], answer: "tía" },
  { sentence: "Yo ___ (ser) el hijo de mi madre.", options: ["soy", "eres", "es"], answer: "soy" },
  { sentence: "Mi abuela ___ (tener) tres hijos.", options: ["tiene", "tengo", "tienen"], answer: "tiene" },
  { sentence: "Nosotros ___ (vivir) con nuestros padres.", options: ["vivimos", "viven", "vivo"], answer: "vivimos" },
  { sentence: "Mi hermana se ___ (llamarse) Ana.", options: ["llama", "llamo", "llamas"], answer: "llama" },
  { sentence: "Yo ___ (querer) mucho a mi familia.", options: ["quiero", "quiere", "queremos"], answer: "quiero" },
  { sentence: "Mi tío ___ (cuidar) a sus hijos.", options: ["cuida", "cuido", "cuidan"], answer: "cuida" },
];

/* ═══════════════ СОСТОЯНИЕ ═══════════════ */

let state = {
  view: "landing",
  // words test
  wDeck: [], wIndex: 0, wRevealed: false, wKnown: [], wUnknown: [], wFinished: false,
  // verbs wizard
  vIndex: 0, vStage: 0, vDone: false,
  // sentence quiz
  qDeck: [], qIndex: 0, qSelected: null, qScore: 0, qWrong: [], qFinished: false,
  // dialogue flashcards
  dIndex: 0, dRevealed: false, dDone: false,
  // mixed examples (family + verbs + character)
  eIndex: 0, eRevealed: false, eDone: false,
  // adjectives test
  aDeck: [], aIndex: 0, aRevealed: false, aKnown: [], aUnknown: [], aFinished: false,
  // pronouns test
  pDeck: [], pIndex: 0, pRevealed: false, pKnown: [], pUnknown: [], pFinished: false,
};

const app = document.getElementById("app");

function render() {
  app.className = "wrap";
  if (state.view === "landing") return renderLanding();
  if (state.view === "home") return renderHome();
  if (state.view === "topic") return renderTopic();
  if (state.view === "words") return renderWords();
  if (state.view === "verbs") return renderVerbs();
  if (state.view === "adj") return renderAdj();
  if (state.view === "pronouns") return renderPronouns();
  if (state.view === "quiz") return renderQuiz();
  if (state.view === "print") return renderPrint();
  if (state.view === "dialog") return renderDialog();
  if (state.view === "examples") return renderExamples();
}

/* ═══════════════ ГЛАВНАЯ ═══════════════ */

function renderLanding() {
  app.innerHTML = `
    <div style="text-align:center; margin-bottom:26px;">
      <div class="eyebrow">Aprender Español</div>
      <div class="page-title" style="margin-bottom:4px;">Home</div>
    </div>

    <div class="topic-card" onclick="goHome()">
      <div>
        <div class="label-big">🗂️ Temas</div>
        <div class="label-sub">Все темы по испанскому</div>
      </div>
      <div class="arrow">→</div>
    </div>
  `;
}

function renderHome() {
  app.innerHTML = `
    <button class="back-btn" onclick="goLanding()">← Home</button>
    <div class="eyebrow">Aprender Español</div>
    <div class="page-title">Темы</div>

    <div class="block-header">Блок 1. Фундамент</div>

    <div class="topic-card" onclick="goTopic()">
      <div>
        <div class="label-small">Тема 1</div>
        <div class="label-big">Mi familia</div>
        <div class="label-sub">Моя семья</div>
      </div>

  if (state.vStage >= 2) {
    phrasesHtml = `
      <div style="width:100%;">
        <div class="stage-label">Фразы</div>
        ${verb.phrases.map(p => `<div class="stage-line">${p}</div>`).join("")}

        ${verb.sentences.map(s => `<div class="stage-line">${s}</div>`).join("")}

  }

  app.innerHTML = `

    <div class="eyebrow" style="margin-bottom:2px;">Mi familia · Verbos</div>

          <span class="flash-tag">${verb.tag}</span>
        </div>
        <div class="flash-tr" style="margin-top:6px; display:inline-block;">${verb.tr}</div>

      <div class="flash-hint">${hint}</div>

      ${[0,1,2].map(s => `<div class="${state.vStage >= s ? 'filled' : ''}"></div>`).join("")}

function tapVerb() {
  const isLast = state.vIndex === VERBS.length - 1;
  if (state.vStage < 2) {

    state.vIndex++;
    state.vStage = 0;
  }
  render();
}

        ${q.shuffledOptions.map(opt => {
          let cls = "option-btn";
          if (answered) {
            cls += " disabled";
            if (opt === q.answer) cls += " correct";
            else if (opt === state.qSelected) cls += " wrong";
          }
          return `<button class="${cls}" onclick="${answered ? '' : `selectQuizAnswer('${opt}')`}">${opt}</button>`;
        }).join("")}
      </div>

      ${answered ? `<button class="next-btn" onclick="nextQuizQuestion()">${state.qIndex + 1 < total ? 'Дальше →' : 'Результаты →'}</button>` : ""}
    </div>

    <div class="counter">${state.qIndex + 1} из ${total}</div>
  `;
}

function selectQuizAnswer(opt) {
  state.qSelected = opt;
  const q = state.qDeck[state.qIndex];
  if (opt === q.answer) {
    state.qScore++;
  } else {
    state.qWrong.push(q);
  }
  render();
}

function nextQuizQuestion() {
  if (state.qIndex + 1 < state.qDeck.length) {
    state.qIndex++;
    state.qSelected = null;
    render();
  } else {
    state.qFinished = true;
    render();
  }
}

  const chunks = [];
  for (let i = 0; i < arr.length; i += size) chunks.push(arr.slice(i, i + size));

}
